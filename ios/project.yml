name: RadAR
options:
  bundleIdPrefix: com.henhen1235
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  RadAR:
    type: application
    platform: iOS
    sources:
      - RadAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henhen1235.radar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: RadAR uses the camera and LiDAR to map the environment.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: RadAR uses GPS to place the map on Earth.
        INFOPLIST_KEY_NSMotionUsageDescription: RadAR uses AirPods head tracking to estimate line of sight.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: RadAR records voice notes and live audio.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: RadAR transcribes voice notes.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: RadAR streams sensor data to the mission control hub.
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: RadAR uses Ultra-Wideband to locate teammates.
