name: RadAR
options:
  bundleIdPrefix: com.henhen1235
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KQ3W39U2QQ
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FitCastSensor:
    type: application
    platform: iOS
    deploymentTarget: "18.0"      # DetectHumanBodyPoseRequest (Swift Vision API) needs iOS 18
    sources:
      - path: FitCastSensor
        excludes: ["README.md"]
    settings:
      base:
        DEVELOPMENT_TEAM: 7JCAPWSS7Z
        PRODUCT_BUNDLE_IDENTIFIER: com.aadit.fitcast.sensor
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: FitCastSensor streams camera, LiDAR depth and body pose to the projection Mac.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: FitCastSensor streams sensor data to the projection Mac on the local network.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
  RadAR:
    type: application
    platform: iOS
    sources:
      - RadAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henhen1235.radar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: RadAR uses the camera and LiDAR to map the environment.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: RadAR uses GPS to place the map on Earth.
        INFOPLIST_KEY_NSMotionUsageDescription: RadAR uses AirPods head tracking to estimate line of sight.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: RadAR records voice notes and live audio.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: RadAR transcribes voice notes.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: RadAR streams sensor data to the mission control hub.
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: RadAR uses Ultra-Wideband to locate teammates.
