# FitCast configuration. Every tunable value lives here. CLI flags override a few (see main.py --help).

capture:
  source: "name:MacBook"    # camera index, video path, 'auto' (first streaming camera) or 'name:<substring>' (AVFoundation device name)
  width: 1280               # processing (camera-space) size
  height: 720
  native_width: 1920        # live cameras: request this capture size ...
  native_height: 1080
  crop: [320, 180, 1600, 900]   # ... and crop this native rect before resizing to camera space (1.5x zoom on the mark)
  fps: 30
  resize_interpolation: area   # area | linear  (area = better mask edges, 6 ms on 4K; linear = 0.4 ms)
  video_loop: true
  video_realtime: true      # play files at their native fps
  stale_ms: 500             # no new frame for this long -> projector shows black (safety)
  reopen_s: 3               # no new frame for this long -> release and reopen the camera (re-probes 'auto')
  stall_exit_s: 600         # no new frame for this long (incl. reopen attempts) -> exit with an error
  black_mean: 2.0           # frames darker than this mean are treated as 'no frame' (macOS black-frame stall)

tracker:
  backend: mediapipe        # mediapipe | rtmlib
  mediapipe:
    pose_model: assets/models/pose_landmarker_full.task
    seg_model: assets/models/selfie_multiclass_256x256.tflite
    min_pose_detection_confidence: 0.5
    min_pose_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    num_poses: 3            # detect up to N people; the tracker keeps the one inside the projector footprint
    seg_confidence_threshold: 0.5   # per-class confidence -> label (bilinear masks, smooth edges)
  rtmlib:
    det_model: assets/models/yolox_tiny_8xb8-300e_humanart-6f3252f9.onnx
    pose_model: assets/models/rtmpose-s_simcc-body7_pt-body7_420e-256x192-acd4a1ef_20230504.onnx
    det_input_size: [416, 416]
    pose_input_size: [192, 256]
    min_score: 0.3
  seg_every_n_frames: 2     # submit the clothes segmenter every Nth frame, reuse the last mask otherwise
  seg_async: true           # run the segmenter in a worker thread (one-frame mask lag, hides ~9 ms per frame)
  roi_from_calibration: true   # track only inside the projector footprint (+margin) when calibrated
  roi_margin_frac: 0.10
  min_visibility: 0.5       # landmark counts as visible above this ...
  frame_margin_px: 8        # ... and when inside the frame by this many px
  mask:
    mode: silhouette        # clothes | skeleton | intersect | silhouette (person minus skin/face/hair: colour-proof)
    background_class: 0
    clothes_class: 4        # selfie_multiclass: 0 bg, 1 hair, 2 body-skin, 3 face-skin, 4 clothes, 5 others
    hair_class: 1
    body_skin_class: 2
    face_class: 3
    close_kernel_px: 5
    erode_px: 6
    temporal_alpha: 0.45    # EMA weight of the newest mask (1.0 = no smoothing)
    mask_hold_frames: 15       # clothes pixels persist this many frames after a segmenter dropout (clipped to the capsule region)
    sil_margin_sw: 0.3         # silhouette mode: fabric may extend this many shoulder widths beyond the skeleton capsules
    forearm_skin_zone_frac: 0.6 # width (shoulder widths) of the forearm/hand zone where segmenter skin is trusted
    area_jump_fallback: 0.40   # fall back to skeleton when clothes area changes more than this fraction ...
    area_jump_frames: 2        # ... for this many consecutive frames
    seg_crop_margin_frac: 0.25 # segmenter runs on the person's bbox grown by this fraction (2x mask resolution)
    fallback_hold_frames: 15
    person_gate_threshold: 0.5 # pose person-mask confidence that gates the clothes mask
    person_gate_dilate_px: 8
    torso_fill: true        # intersect mode: union (person mask ∩ torso polygon, minus skin) to fill segmenter holes on the torso
    torso_fill_hem_frac: 0.5   # fill polygon hem drop as a fraction of skeleton.hem_drop_frac
    skeleton:               # widths as fractions of shoulder width
      torso_margin_frac: 0.15
      neck_raise_frac: 0.18   # torso core top above the shoulder joints (collar area; white tee on a white wall)
      neck_strip_width_frac: 0.5   # collar strip above the shoulder line, this many shoulder widths wide ...
      neck_strip_raise_frac: 0.25  # ... and this high (white tee on a white wall: the segmenter cannot see it)
      hem_drop_frac: 0.15
      upper_arm_width_frac: 0.32
      forearm_width_frac: 0.26
      thigh_width_frac: 0.55
      shin_width_frac: 0.45
      min_torso_width_frac: 0.7   # side view: torso polygon is at least this wide (fraction of shoulder width)
      dilate_px: 16         # extra dilation when used as a gate in intersect mode
  head:
    side_margin_frac: 0.30  # per side, fraction of shoulder width
    top_margin_frac: 0.70   # above the topmost face landmark (covers caps and hair)
    bottom_gap_frac: 0.05   # box bottom never lower than this far above the shoulder line ...
    chin_margin_frac: 0.15  # ... and normally ends this far below the lowest face landmark (chin + margin)
    bottom_min_margin_frac: 0.12  # floor for the bottom margin below the lowest face landmark (sides/top keep min_margin_frac)
    min_margin_frac: 0.25   # spec minimum: never less than this around the face
    use_person_mask: true   # also union the pose person-mask pixels above the shoulders
    search_window_frac: 0.4    # half-width (fraction of shoulder width) around the face centre searched for person/hair pixels
    side_width_floor_frac: 0.7 # in side view size the box/skeleton from at least this fraction of the reference shoulder width
  max_shoulder_px: 320      # wider shoulders = someone at the lens, not in the beam: ignored
  facing:
    side_ratio: 0.55        # shoulder_width / ref < this -> side
    hold_frames: 15         # frames a new facing must persist (0.5 s): brief landmark swaps never flip the texture
    ref_window_frames: 600  # frontal reference = max shoulder width over this many recent frames (~20 s): self-healing
    ref_percentile: 90        # frontal reference = this percentile of the window (not the max: outlier-proof)
    face_vis_back_threshold: 0.0   # weak "back" hint from face visibility: off (MediaPipe reports ~1.0 from behind; Vision confidences drop with distance)

smoothing:
  min_cutoff: 0.6           # lower = steadier at rest (One Euro)
  beta: 0.02                # lower = less speed-adaptive (less jitter during slow moves)
  d_cutoff: 1.0
  predict_ms: 30            # initial prediction horizon
  predict_auto: true        # replace it with the measured capture->display latency (EMA, clamped)
  predict_max_ms: 40        # short horizon: velocity noise x horizon is what made garments jitter
  max_predict_px: 12
  max_jump_sw: 0.4          # shoulders/hips may move at most this many shoulder widths per frame (else frozen) ...
  max_jump_sw_limbs: 0.9    # ... limbs this much (a swipe is ~0.2 per frame)
  max_freeze_frames: 5      # after this many frozen frames the new position is accepted (real fast move)
  max_jump_px_floor: 24     # the per-frame limit is never below this many pixels

renderer:
  torso_margin_frac: 0.12   # expand torso quad outward, fraction of shoulder width
  neck_raise_frac: 0.20     # raise the top edge towards the neck base (the mask clips what is not fabric)
  neck_raise_back_frac: 0.45 # back view: shoulder landmarks sit low from behind, lift the back texture to the neck
  hem_drop_frac: 0.05       # extend the bottom edge below the hips (a tee hem sits at the hip joints)
  upper_arm_width_frac: 0.30
  forearm_width_frac: 0.24
  sleeve_overlap_frac: 0.08
  short_sleeve_frac: 0.65   # short sleeves end at this fraction of shoulder->elbow
  leg_width_frac: 0.80      # wide: baggy legs; the clothes mask clips the texture to the real pants
  shin_width_frac: 0.70
  waist_band_height_frac: 0.14
  side_min_width_frac: 0.85 # side view: torso quad is at least this wide (fraction of ref shoulder width); the mask clips it
  front_min_width_frac: 0.7 # front/back: torso quad never narrower than this fraction of the reference shoulder width
  bottom_knee_frac: 0.55    # where the bottoms texture splits thigh / shin (fraction of its height)
  waist_min_half_width_frac: 0.45
  feather_px: 4
  vertical_offset_frac: 0.0 # global up(-)/down(+) nudge of all garment parts, in shoulder widths; keys [ and ] adjust live
  taper:                    # end-width multipliers and overlaps of the limb quads
    upper_arm: 0.85
    forearm: 0.8
    forearm_overlap: 0.5
    thigh: 0.85
    thigh_overlap: 0.3
    thigh_src_start: 0.8    # thigh texture starts at this fraction of the waist band height
    shin: 0.9
    shin_overlap: 0.3
    waist_band_extent: 0.6

compositor:
  brightness: 1.0
  gamma: 1.0
  fade_ms: 400              # fade out/in when tracking is lost/regained
  head_fill_level: 30       # flat grey on the head box (0 = black). Hard cap 64 (25%): never bright, never garment pixels
  gallery:
    enabled: true
    rect: [20, 40, 300, 700]   # x0 y0 x1 y1, camera px; set during calibration so it lands on the wall
    thumbs_visible: 5
    thumb_size: 72
    current_scale: 1.3
    anim_ms: 200
    font_scale: 0.55
    bg_color: [20, 20, 20]
    accent_color: [60, 220, 255]   # BGR
    min_gap_to_person_px: 10

gestures:
  window_s: 0.4
  min_travel_sw: 1.2        # horizontal travel in shoulder widths within the window
  min_velocity_sw_per_s: 2.5
  max_velocity_sw_per_s: 12   # faster than this is a landmark jump (turns, identity switches), not a swipe
  max_travel_sw: 2.6
  cooldown_s: 1.2
  band_top_frac: -0.3       # wrist must stay between the top of the head (top) ...
  band_bottom_frac: 1.7     # ... and mid-thigh (bottom); fractions along head->hip span
  vertical_swipes: true     # per-hand vertical swipes: right hand up/down scrolls bottoms, left hand scrolls tops
  hand_for_bottoms: right   # the person's right hand
  min_travel_sw_vertical: 0.9
  min_velocity_sw_per_s_vertical: 1.8
  zone_swipes: true         # fallback scheme when vertical_swipes is false: horizontal swipe above/below the waist
  zone_line_sw: -0.3        # zone split, shoulder widths above the hip line: chest/head = tops, waist/legs = bottoms
  min_travel_sw_zone: 0.9           # with zone swipes both zones accept subtler swipes ...
  max_body_travel_sw: 0.5           # shoulder centre may move at most this much within the window (no swipes while walking)
  other_hand_max_travel_sw: 0.5     # the other wrist must stay put (both arms moving = arm swing)
  min_velocity_sw_per_s_zone: 1.8   # ... and slower ones (the landmark-jump caps still apply)
  person_right_is_next: true   # swipe toward the person's own right -> next outfit
  mirror_x: false           # set true if the camera feed is horizontally mirrored
  raise_hands_s: 1.0
  tpose_s: 1.5              # arms straight out to the sides for this long -> self-calibration ("calibrate" event)
  tpose_level_sw: 0.45      # wrist within this many shoulder widths of shoulder height
  tpose_reach_sw: 0.75      # wrist at least this far outside the shoulder
  min_wrist_visibility: 0.5
  min_samples: 4            # a swipe needs at least this many samples in the window (rejects landmark jumps)
  log_events: true

calibration:
  file: calibration.yaml
  sim_file: calibration_sim.yaml   # --simulate output; marked simulated and refused for live cameras
  projector_width: 1920
  projector_height: 1080
  marker_grid: [3, 3]       # cols, rows of projected markers (4..9)
  marker_radius_px: 30
  marker_margin_frac: 0.15  # inset from the projector frame edges
  min_blob_area_px: 40
  diff_threshold: 40        # adaptive threshold CAP (lit-minus-dark, channel max)
  diff_threshold_min: 12    # adaptive threshold floor
  adaptive_frac: 0.4        # threshold = this fraction of the contrast peak, clamped to [min, cap]
  verify_tolerance_px: 6
  max_reproj_px: 10         # calibrations above this RMS (projector px) are neither saved by --auto nor loaded
  settle_frames: 10         # frames to wait after changing the projected pattern
  blur_ksize: 5             # gaussian blur on the lit-minus-dark difference image (odd)
  depth_interp_min: -0.5    # two-plane model: clamp of the interpolation factor between the two self-calibrated planes
  depth_interp_max: 1.5
  ransac_reproj_px: 8.0     # RANSAC inlier threshold, projector px (~5 camera px)
  seam_feather_px: 60       # projector rows blended between the upper- and lower-body warps at the hip line
  min_fill_ratio: 0.6       # marker blobs must fill >= this of their bounding box (a disc is 0.785)
  max_aspect: 2.0           # and be at most this elongated
  max_blob_area_px: 6000    # larger blobs are people / glare
  min_marker_mean_diff: 20  # single-marker mode: mean difference inside the disc must exceed this
  median_frames: 3          # single-marker mode: per-pixel median of this many frames per capture
  refine_disc_radius_px: 40 # --refine: radius of the probe disc drawn on the body (camera px)
  refine_done_px: 4         # --refine: stop when the measured offset is below this (camera px)
  refine_wait_s: 20         # --refine: wait this long for a tracked person before giving up
  refine_max_px: 150        # --refine: offsets above this are rejected (wrong person / disc off the body)
  refine_depth_change_frac: 0.25   # --refine --depth-point: torso length must differ from the reference spot by at least this (noise otherwise)
  refine_still_px: 3        # --refine: torso centre must move less than this per frame for 10 frames before probing
  refine_max_disagreement_px: 30   # --refine: chest and belly probes must agree within this, else the pass is discarded

sizing:
  height_cm: 175            # operator enters this; --height overrides
  nose_to_ankle_ratio: 0.88 # nose-to-ankle distance as a fraction of standing height
  shoulder_to_hip_ratio: 0.32   # MediaPipe shoulder-centre -> hip-centre as a fraction of height (fallback when ankles unseen; measured on the test clips)
  average_frames: 150       # ~5 s at 30 fps
  chest_row_percentile: 25  # robust 'narrow' row width within the chest band (0 = min)
  label_hold_s: 3.0         # a new size label must persist this long before it is shown
  chest_mask_band_frac: [0.25, 0.60]   # fraction of shoulder->hip span searched; the narrowest row wins (below sleeves, above hem)
  min_frontal_ratio: 0.9    # only accumulate when shoulder_width / ref >= this (squarely facing the camera)
  min_ankle_frames: 10      # use ankle-based scale once this many recent frames have it (never mix the two scales)
  default_table: mens
  min_visibility: 0.5
  chest_fallback_shoulder_frac: 1.15   # chest width = this * shoulder width when the mask band is empty
  chest_circumference_factor: 2.3      # frontal mask width (incl. garment ease) -> chest circumference
  shoulder_landmark_factor: 1.2        # MediaPipe shoulder joints sit inside the acromions
  charts:                   # upper bounds (cm) per size; first size whose bound >= measurement wins
    mens:
      key: combined          # average of the shoulder and chest size indices
      sizes: [XS, S, M, L, XL, XXL]
      chest: [86, 94, 102, 110, 118, 130]
      shoulder: [41, 44, 47, 50, 53, 57]
    womens:
      key: combined
      sizes: [XS, S, M, L, XL, XXL]
      chest: [80, 86, 92, 100, 108, 120]
      shoulder: [37, 39, 41, 43, 46, 49]

display:
  projector_x: null         # null = auto-detect second display origin
  projector_y: null
  projector_window: FitCast Projector
  debug_window: FitCast Debug
  debug_scale: 0.6
  debug_every_n: 2          # redraw the laptop debug window every Nth frame (a Cocoa imshow costs ~10 ms)
  projector_sink: cocoa     # cocoa = CoreGraphics layer blit (~2 ms) | opencv = cv2.imshow (~19 ms at 1080p)
  debug_show_composite: true   # debug window shows camera overlay | projector composite side by side
  mask_tint: false          # debug/recording: outline the mask instead of tinting it (keeps projected light visible)
  pump_every_n: 2           # run the Cocoa event pump (waitKey, ~12 ms) every Nth frame; the projector commits every frame
  show_debug: true

demo:
  auto_cycle_s: 8
  idle_s: 20

logging:
  frame_stats: true         # per-frame csv (ok, facing, mask px, lit px, fallback, outfit) for flicker diagnosis
  frame_stats_file: out/frame_stats.csv
  level: INFO
  stats_window: 3000        # frames kept for the exit report (bounded memory)

garments:
  dir: assets/garments
  saturation_boost: 1.35    # projected color on white fabric washes out; assets are made punchier than source
  brightness_boost: 1.15
  min_mean_luminance: 70    # warn below this (0-255); near-black garments do not project
  top_size: [512, 640]      # w, h of generated/normalized top images
  bottom_size: [512, 768]
  thumb_size: 160
  back_collar_frac: 0.18    # top-center region (fraction of height) inpainted when synthesizing a back view
  white_bg_threshold: 235   # plain product photos: pixels brighter than this are background
  sleeve_tile_size: 256
  hem_rows_frac: 0.15       # bottom rows of the alpha used to estimate the torso x-extent of imported tops
  thumb_bg: [48, 48, 48]
  thumb_margin_frac: 0.06
  opaque_alpha: 250
  luminance_alpha: 128      # pixels with alpha above this count toward mean luminance

# ---------------- 3D sensor path (docs/BUILD_SPEC_3D.md) ----------------
sensor:
  kind: webcam              # webcam | iphone  (--sensor overrides)
  cam_size: [960, 720]      # camera space for the iphone path (4:3 like the phone: square pixels)
  port: 7777                # TCP port the phone app listens on
  usbmux: true              # connect over USB (usbmuxd); false = connect to `host`
  host: 127.0.0.1
  udid: null                # usbmux: pick this device (null = first USB iPhone)
  connect_timeout_s: 10
  stale_ms: 500
  reconnect_s: 1.0
  recv_timeout_s: 0.05
  recv_bytes: 1048576
  max_payload_mb: 64
  ping_interval_s: 1.0
  ping_window: 8
  stats_window_s: 1.0
  depth_interp: nearest     # nearest | linear (linear invents depths across edges)
  min_visibility: null      # null = tracker.min_visibility
  synth_head_frac: 0.5

depthmask:
  background_frames: 60     # ~2 s at 30 fps of the empty scene
  closer_than_background_m: 0.08
  box_m: [-1.0, 1.0, -1.5, 1.2, 1.5, 5.0]   # x0 x1 y0 y1 z0 z1 metres around the mark (OpenCV camera coords)
  min_confidence: 1         # ARKit depth confidence 0 low, 1 medium, 2 high
  open_px: 1                # radius in depth px (wrists are ~7 depth px wide at 3 m; radius 3 erased them)
  close_px: 3               # radius in depth px (7 bridged the arm-torso gap)
  min_component_frac: 0.002 # drop depth blobs smaller than this fraction of the depth image
  guided_radius_px: 8       # edge-aware upsampling of the low-res depth mask with the RGB image
  guided_eps: 0.001         # in 0..1 intensity units
  guided_scale: 0.5         # OpenCV fast guided filter (2x faster, same IoU on synthetic tests)
  fuse_person_seg: true
  fuse_skeleton: true
  fuse_reach_px: 12         # RGB segmentation / skeleton may extend the depth mask only this far (camera px)

render3d:
  backend: moderngl
  depth_gap_m: 0.12         # skip triangles across depth discontinuities larger than this
  fill_holes_px: 2          # tiny holes only, never across real gaps
  mesh_step: 1              # 1 = one vertex per depth pixel
  distortion_radius_factor: 1.5
  k_drift_warn_px: 5.0      # warn when live intrinsics differ from calibration3d by more than this

calibration3d:
  file: calibration3d.yaml
  throw_ratio_guess: 1.19   # Epson CO-FH02 (image width = distance / throw ratio)
  gray_code_white_threshold: 5
  gray_code_black_threshold: 40
  frames_per_pattern: 3
  min_depth_confidence: 2
  ransac_reproj_px: 3.0
  target_reproj_px: 1.5
  min_depth_span_m: 0.35    # 5-95% depth span of the correspondences; below = target too planar, refuse
  settle_frames: 10
  depth_frames: 10
  max_correspondences: 50000
  max_calib_points: 4000
  min_points: 500
  solve_rounds: 2
  ransac_iterations: 500
  coarse_ransac_px: 25.0
  ransac_confidence: 0.999
  lm_max_iter: 200
  fix_k3: true
  zero_tangent_dist: true
  seed: 0
  verify_grid_m: 0.1
  verify_edge_m: 0.1
  verify_line_px: 3

latency:                    # scripts/latency_probe.py
  period_s: 1.0             # white this long, then black this long
  count: 20                 # flash cycles per phase
  roi_frac: 0.2             # default camera ROI = centred box of this fraction
  max_delay_s: 0.8
  settle_s: 1.5             # black before phase 1 (camera warm-up)
  robust_pct: 5.0
  hysteresis_frac: 0.15
  min_contrast: 12.0        # grey levels; below this the camera does not see the flash
  loop_timeout_s: 2.0
  poll_s: 0.001
  out_dir: out

accuracy:                   # scripts/accuracy_check.py (BUILD_SPEC_3D section 10)
  outline_thickness_px: 2
  outline_color: [255, 255, 255]
  dark_every_n: 10          # re-capture a dark reference every N evaluated frames (use 2 for the turn phase if motion contaminates)
  seconds: 10
  max_search_px: 50
  min_blob_px: 8
  annotate_frames: 3
  frame_timeout_s: 5.0
  out_dir: out
  sim_person_offset_m: 0.8
  sim_frames: 4
  sim_shift_px: 15
  sim_frames_per_pattern: 1
  sim_max_median_mm: 3.0
  sim_shift_min_ratio: 3.0
  sim_shift_min_frac: 0.4

selfcal:                    # self-service calibration (T-pose or key t): discs over the projector frame, person stands still
  grid: [6, 4]              # cols x rows of discs (first pass, whole projector frame)
  body_grid: [3, 5]         # cols x rows of discs aimed at the body in the second pass
  blind_top_frac: 0.3       # first pass without a mapping yet: no discs in this top band (head)
  settle_frames: 5          # frames to wait after a pattern change (camera latency)
  median_frames: 2          # frames per capture (per-pixel median)
  initial_settle_s: 1.0     # black before the first disc (auto exposure settles)
  edge_band_px: 18          # silhouette band excluded from disc detection (body sway)
  dense: true               # after the discs: Gray-code scan -> per-pixel map, body plane from thousands of points
  dense_level: 170          # grey level of the Gray-code patterns (255 clips on white fabric)
  dense_sat_level: 250      # camera pixels at/above this in the white capture are not decoded
  dense_black_threshold: 12 # lit pixel: white - black capture difference above this
  dense_white_threshold: 4  # unambiguous bit: |code - inverse| above this
  dense_ransac_px: 8.0      # projector px: inlier gate for the final plane statistics
  dense_coarse_px: 20.0     # projector px: coarse RANSAC gate (body = one tilted plane; keeps the torso in)
  dense_max_points: 4000
  dense_min_body_points: 300
  dense_min_inlier_frac: 0.5
  dense_head_pad_proj_px: 40   # extra black margin around the head in projector px during the scan and the mesh
  split_model: true         # dense scan also fits upper/lower body planes (hip line); the warp blends them
  split_min_points: 200
  mesh_show_s: 3.0          # green dot mesh + outline on the body after calibration (visual check)
  mesh_dot_radius_px: 5     # ~1.4 cm at a 2.6 m wide beam
  mesh_spacing_px: 16       # camera px between mesh dots
  mesh_outline_step_px: 12  # camera px between outline dots
  margin_frac: 0.08
  disc_radius_px: 28        # projector px
  disc_level: 190           # grey level of the discs (brief; the head region is excluded from detection and skipped once a mapping exists)
  head_pad_px: 12           # camera px around the head box where discs are ignored / not projected
  change_frac: 0.25         # torso length change that counts as a second standing distance
  min_body_discs: 3
  debug_images: 6           # out/selfcal_disc_XX.jpg (lit | difference) for the first discs
  trigger_file: out/calibrate.now   # `touch` this file to start self-calibration remotely (same as key t)

stylist:                    # optional Gemini outfit picker (needs network + a key; the demo is offline without it)
  enabled: false            # or run with --stylist
  key_file: secrets/gemini.key   # gitignored; GEMINI_API_KEY in the environment wins
  models: [gemini-3.8-flash, gemini-3.1-flash-lite, gemini-3.7-flash, gemini-3.5-flash]   # free-tier Flash models, tried in order on 404/429/503
  timeout_s: 40
  temperature: 0.4
  grounding: false          # google_search tool for live shop links (needs quota)
  speak: true               # macOS `say` reads the one-sentence answer
  message_s: 30             # how long the answer + shopping list stays on the wall
  record_key: v             # press once to start recording, again to send
  record_device: ":0"       # ffmpeg avfoundation audio device (":0" = default microphone)
  record_file: out/ask.wav
  record_max_s: 12
  ask_file: out/ask.txt     # write a typed question here to ask without a microphone
  links_file: assets/shop_links.yaml   # curated 'where to buy' links per garment name (shown + QR on the wall)
  links_out: out/last_links.txt        # the last answer's links, ready to copy / send
  imessage_to: ""           # phone number or Apple ID: links are sent with Messages.app after every answer (macOS)
  wake:                     # hands-free trigger: offline Vosk recogniser on the laptop microphone
    enabled: true
    model_dir: assets/models/vosk-model-small-en-us-0.15
    device: ":0"            # ffmpeg avfoundation audio device
    wake_words: [fitbot, fit bot, fit but, fitbit, fit bit, fat bit, fit bought, feet bot, fit pot]   # how the small model hears "Fitbot"
    silence_rms: 250        # int16 RMS below this = silence
    silence_s: 0.9          # pause that ends the request
    max_request_s: 10
    pre_roll_s: 0.6
    chime: /System/Library/Sounds/Glass.aiff
    request_file: out/wake_request.wav
